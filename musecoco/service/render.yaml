# MuseCoco Stage-1 (Text-to-Attribute) — Render Blueprint
# Deploy via: https://dashboard.render.com/blueprints
# After deploy, set MUSECOGO_API_SECRET as a secret env var in the Render dashboard.

services:
  - type: web
    name: musecoco-t2a
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./service/Dockerfile
    envVars:
      - key: T2A_MODEL
        value: XinXuNLPer/MuseCoco_text2attribute
      - key: MUSECOGO_API_SECRET
        sync: false
