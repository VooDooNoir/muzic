# MuseCoco Service - Render Deployment (Fixed Path)
services:
  - type: web
    name: musecoco-t2a
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    dockerFilePath: musecoco/service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: T2A_MODEL
        value: XinXuNLPer/MuseCoco_text2attribute