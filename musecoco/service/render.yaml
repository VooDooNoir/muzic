# MuseCoco Service - Render Deployment (Corrected Context)
services:
  - type: web
    name: musecoco-t2a
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    dockerFilePath: service/Dockerfile
    dockerContext: musecoco/
    envVars:
      - key: PORT
        value: 8090
      - key: T2A_MODEL
        value: XinXuNLPer/MuseCoco_text2attribute